# Sirve la consola ya construida en "/" (el gateway le manda todo lo que no es
# /api, /games ni /panel).
server {
    listen 8080;
    root /usr/share/nginx/html;
    absolute_redirect off;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Los archivos con hash en el nombre se pueden guardar mucho tiempo; el index no.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
