# Provisional (hasta sdk/server): sirve el juego bajo /games/connect4/.
server {
    listen 8080;
    root /usr/share/nginx/html;
    absolute_redirect off;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }
    location /games/connect4/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /games/connect4/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /games/connect4/index.html;
    }
}
