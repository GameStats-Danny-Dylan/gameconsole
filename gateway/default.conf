# Gateway de GameConsole: la única puerta de entrada (protocolo, sección 1).
#
# Todo se resuelve con el DNS interno de Docker en cada pedido (resolver +
# variables), así:
#   - nginx arranca aunque falte un servicio (por ejemplo, la consola o un juego
#     que todavía no existe) y responde una página de aviso en vez de caerse;
#   - si un contenedor se reinicia y cambia de IP, nginx lo encuentra igual.
# Con variables, proxy_pass no cambia la ruta: el prefijo /api/... se cambia
# con rewrite antes de pasar el pedido.

resolver 127.0.0.11 valid=10s ipv6=off;   # DNS de Docker

server {
    listen 80;
    server_name _;
    # Redirecciones relativas: detrás del puerto 8000 o del túnel (https) un
    # "Location: http://localhost/..." absoluto mandaría a otro lado.
    absolute_redirect off;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_connect_timeout 3s;

    # Para el healthcheck de Docker.
    location = /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # ---------------- GameStats: ingestión (Go) ----------------
    location = /api/events  { set $up ingestion:8080; rewrite ^ /events  break; proxy_pass http://$up; }
    location = /api/matches { set $up ingestion:8080; rewrite ^ /matches break; proxy_pass http://$up; }
    location = /api/games   { set $up ingestion:8080; rewrite ^ /games   break; proxy_pass http://$up; }

    # ---------------- GameStats: análisis (Scala) ----------------
    location /api/stats/   { set $up analytics:8081; rewrite ^/api(/.*)$ $1 break; proxy_pass http://$up; }
    location /api/results  { set $up analytics:8081; rewrite ^/api(/.*)$ $1 break; proxy_pass http://$up; }
    location /api/players/ { set $up analytics:8081; rewrite ^/api(/.*)$ $1 break; proxy_pass http://$up; }

    # ---------------- Registry e IA ----------------
    location /api/registry/ { set $up registry:8080; rewrite ^/api/registry(/.*)$ $1 break; proxy_pass http://$up; }
    location /api/ai/       { set $up prolog:8080;   rewrite ^/api/ai(/.*)$       $1 break; proxy_pass http://$up; }

    location /api/ {
        default_type application/json;
        return 404 '{"error":"no existe esa ruta de la API"}';
    }

    # ---------------- Juegos dinámicos ----------------
    # /games/{id}/... -> contenedor game-{id}:8080 con la ruta completa.
    # Agregar un juego no cambia este archivo.
    location ~ ^/games/(?<gid>[a-z0-9-]+)/ {
        proxy_pass http://game-$gid:8080;
        error_page 502 503 504 = @game_down;
    }
    location ~ ^/games/(?<gid>[a-z0-9-]+)$ {
        return 301 /games/$gid/;
    }

    # ---------------- Panel de estadísticas ----------------
    location /panel/ {
        set $up panel:8080;
        proxy_pass http://$up;
        error_page 502 503 504 = @panel_down;
    }
    location = /panel { return 301 /panel/; }

    # ---------------- Consola ----------------
    location / {
        set $up console:8080;
        proxy_pass http://$up;
        error_page 502 503 504 = @console_down;
    }

    # ---------------- Avisos ----------------
    location @game_down {
        default_type text/html;
        return 503 '<!doctype html><meta charset="utf-8"><title>Juego no disponible</title><body style="font-family:system-ui;padding:2rem"><h1>Este juego no está disponible</h1><p>Su contenedor no está corriendo. Vuelve a la consola y elige otro.</p></body>';
    }
    location @panel_down {
        default_type text/html;
        return 503 '<!doctype html><meta charset="utf-8"><title>Panel no disponible</title><body style="font-family:system-ui;padding:2rem"><h1>El panel no está corriendo</h1><p>Levanta el servicio <code>panel</code> del docker compose.</p></body>';
    }
    location @console_down {
        default_type text/html;
        return 503 '<!doctype html><meta charset="utf-8"><title>GameConsole</title><body style="font-family:system-ui;padding:2rem"><h1>GameConsole</h1><p>La consola todavía no está corriendo. Mientras tanto: <a href="/panel/">panel de estadísticas</a>, <a href="/games/connect4/">4 en línea (modo de prueba)</a>, <a href="/api/registry/games">/api/registry/games</a>, <a href="/api/ai/health">/api/ai/health</a>, <a href="/api/matches">/api/matches</a>, <a href="/api/results">/api/results</a>.</p></body>';
    }
}
